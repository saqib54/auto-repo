name: Daily GitHub Contribution Bot

on:
  schedule:
    # Runs daily at 09:00 UTC (14:00 PKT)
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Daily Auto-Commit Engine
        run: node src/auto-commit.js

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json CONTRIBUTIONS.md
          if git diff --staged --quiet; then
            echo "No changes to commit today."
          else
            git commit -m "📈 Daily contribution update [$(date +'%Y-%m-%d')]"
            git push
          fi
